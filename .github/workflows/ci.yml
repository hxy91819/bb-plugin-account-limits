name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run check
      - run: npm install --global bb-app@0.46.1
      - run: npm run build
      - run: npm run package
      - name: Scan secrets with verified gitleaks binary
        shell: bash
        run: |
          scan_dir=$(mktemp -d)
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$scan_dir/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt --output "$scan_dir/checksums.txt"
          (cd "$scan_dir" && awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz"' checksums.txt > selected.sha256 && test -s selected.sha256 && sha256sum --check selected.sha256)
          tar -xzf "$scan_dir/gitleaks_8.30.1_linux_x64.tar.gz" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" dir . --redact --no-banner --config .gitleaks.toml
